# Render Blueprint - Production Deployment
# Deploy: render.com > New > Blueprint > Connect this repository
#
# Services:
# 1. likhitex-api (web) - FastAPI backend on free tier
# 2. likhitex-compiler (private) - LaTeX compilation service
# 3. likhitex-cron (cron) - Daily backup job
#
# External dependencies (configure manually):
# - Neon Postgres (DATABASE_URL)
# - Upstash Redis (REDIS_URL)
# - Backblaze B2 (S3_* credentials) - free 10GB, no card required
# - Clerk (CLERK_* keys)

services:
  # ============================================================================
  # FastAPI Backend - Main API Service
  # ============================================================================
  - type: web
    name: likhitex-api
    env: docker
    region: oregon  # Choose closest region: oregon, frankfurt, singapore
    plan: free  # Upgrade to starter ($7/mo) for no cold starts
    
    # Docker build configuration
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    
    # Auto-deploy on git push
    branch: main
    autoDeploy: true
    
    # Health check (required for Render to know service is ready)
    healthCheckPath: /health
    
    # Resource limits (free tier: 512MB RAM, 0.1 CPU, sleeps after 15min idle)
    # Render automatically manages these on free tier
    
    # Environment Variables
    # CRITICAL: Set sync: false variables manually in Render Dashboard
    # Generate: AUTO-GENERATED by Render
    envVars:
      # === App Configuration ===
      - key: APP_ENV
        value: production
      
      - key: DEBUG
        value: "false"
      
      - key: LOG_LEVEL
        value: INFO
      
      - key: APP_NAME
        value: Likhitex
      
      # === Security (CRITICAL - SET MANUALLY) ===
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates 32+ char secret
      
      - key: CLERK_SECRET_KEY
        sync: false  # Get from clerk.com dashboard
      
      - key: CLERK_PUBLISHABLE_KEY
        sync: false  # Get from clerk.com dashboard
      
      - key: CLERK_JWKS_URL
        sync: false  # https://<your-app>.clerk.accounts.dev/.well-known/jwks.json
      
      - key: CLERK_ISSUER
        sync: false  # https://<your-app>.clerk.accounts.dev (no trailing slash)
      
      - key: CLERK_AUDIENCE
        value: ""  # Optional, leave empty unless using custom Clerk setup
      
      - key: INVITE_ONLY
        value: "true"
      
      # === Database (CRITICAL - SET MANUALLY) ===
      - key: DATABASE_URL
        sync: false  # Neon Postgres connection string (pooled)
        # Format: postgresql://user:pass@ep-xxx-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      
      - key: DB_POOL_SIZE
        value: "5"  # Optimized for 512MB RAM
      
      - key: DB_MAX_OVERFLOW
        value: "2"  # Total 7 connections max
      
      - key: DB_POOL_RECYCLE
        value: "300"  # Recycle every 5 minutes
      
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "15000"  # 15 second query timeout
      
      # === Redis Cache (CRITICAL - SET MANUALLY) ===
      - key: REDIS_URL
        sync: false  # Upstash Redis connection string
        # Format: redis://default:xxx@xxx.upstash.io:6379
      
      - key: REDIS_REQUIRED
        value: "false"  # Fail gracefully if Redis is down
      
      # === File Storage - Backblaze B2 (S3-compatible, no card required) ===
      - key: STORAGE_BACKEND
        value: s3
      
      - key: S3_ENDPOINT_URL
        sync: false  # Bucket page > "Endpoint", prefixed with https://
        # Format: https://s3.us-west-004.backblazeb2.com
      
      - key: S3_ACCESS_KEY_ID
        sync: false  # Application Keys > keyID
      
      - key: S3_SECRET_ACCESS_KEY
        sync: false  # Application Keys > applicationKey (shown once)
      
      - key: S3_BUCKET_NAME
        sync: false  # Your private bucket name
      
      # === CORS & Security ===
      - key: CORS_ORIGINS
        value: https://likhitex.vercel.app  # CHANGE THIS to your actual Vercel URL
      
      - key: ALLOWED_HOSTS
        value: likhitex-api.onrender.com,likhitex.vercel.app
      
      # === Rate Limiting ===
      - key: RATE_LIMIT_ENABLED
        value: "true"
      
      - key: RATE_LIMIT_COMPILE_PER_USER
        value: "10"  # Compiles per minute per user
      
      - key: RATE_LIMIT_COMPILE_GLOBAL
        value: "50"  # Total compiles per minute
      
      - key: RATE_LIMIT_UPLOAD_PER_USER
        value: "50"  # File uploads per minute per user
      
      # === Quotas ===
      - key: QUOTA_PER_USER_MB
        value: "50"
      
      - key: QUOTA_PER_PROJECT_MB
        value: "50"
      
      - key: QUOTA_PER_FILE_MB
        value: "10"
      
      # === Compilation ===
      - key: COMPILE_TIMEOUT_SECONDS
        value: "60"
      
      - key: COMPILE_BACKEND
        value: direct  # Use 'direct' for free tier (in-process), 'local' for Docker
      
      - key: COMPILE_MAX_CONCURRENT
        value: "2"  # Limit concurrent compilations on free tier
      
      - key: COMPILE_MEMORY_LIMIT
        value: 256m  # Per-compile memory limit
      
      - key: COMPILE_MAX_INPUT_BYTES
        value: "2097152"  # 2MB max input size
      
      # === Mail ===
      - key: MAIL_BACKEND
        value: console  # Change to 'http' when using Resend
      
      - key: MAIL_FROM
        value: noreply@likhitex.app
      
      - key: RESEND_API_KEY
        sync: false  # Optional: for email notifications via Resend
      
      # === WebSocket (Collaboration) ===
      - key: COLLAB_WS_URL
        value: wss://likhitex-api.onrender.com/collab  # WebSocket endpoint
      
      - key: WS_TICKET_TTL
        value: "30"  # Ticket valid for 30 seconds
      
      - key: WS_MAX_PENDING_TICKETS_PER_USER
        value: "10"

  # ============================================================================
  # LaTeX Compiler - Private Service (Optional, for Docker backend)
  # ============================================================================
  # Uncomment this if using COMPILE_BACKEND=local instead of direct
  #
  # - type: private
  #   name: likhitex-compiler
  #   env: docker
  #   region: oregon
  #   plan: free
  #   
  #   dockerfilePath: ./apps/compiler/Dockerfile
  #   dockerContext: .
  #   branch: main
  #   autoDeploy: true
  #   
  #   # Private service - only reachable from likhitex-api
  #   # API reaches it at: http://likhitex-compiler:10000

