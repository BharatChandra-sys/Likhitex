# ============================================================================
# Documentation & Notes
# ============================================================================
#
# == Deployment Steps ==
# 1. Push this file to your GitHub repo
# 2. Go to render.com > New > Blueprint
# 3. Connect your repo and select this file
# 4. Render will create the service(s)
# 5. Set the sync: false environment variables manually in Render Dashboard:
#    - DATABASE_URL (from Neon)
#    - REDIS_URL (from Upstash)
#    - CLERK_SECRET_KEY (from Clerk)
#    - CLERK_PUBLISHABLE_KEY (from Clerk)
#    - CLERK_JWKS_URL, CLERK_ISSUER (from Clerk)
#    - S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET_NAME (from Backblaze B2)
#    - CORS_ORIGINS (your Vercel URL)
#
# == Cold Starts ==
# Render free tier sleeps after 15 minutes of inactivity.
# First request after sleep takes ~60-90 seconds to wake up.
# Solutions:
# - Use UptimeRobot (free) to ping /health every 10 minutes
# - Upgrade to Starter plan ($7/mo) for always-on instances
#
# == Resource Limits ==
# Free tier: 512MB RAM, 0.1 CPU, 750 instance-hours/month
# If you exceed 750 hours, service suspends until next month.
#
# == Database ==
# Use Neon Postgres (NOT Render's Postgres):
# - Neon free: 0.5GB, scale-to-zero, no expiry
# - Render Postgres free: 1GB but DELETED after 30 days
#
# == Monitoring ==
# - Render Dashboard: logs, metrics, alerts
# - Uptime check: render.com > Service > Health Checks
# - Add Sentry (optional): SENTRY_DSN environment variable
#
# == Scaling ==
# When you outgrow free tier:
# - API: Starter plan ($7/mo) = 512MB RAM, 0.5 CPU, always-on
# - Database: Neon Launch ($19/mo) = 3GB, dedicated compute
# - Redis: Upstash pay-as-you-go ($0.20/100K commands)
# - Backblaze B2: $0.006/GB-month after the free 10GB
#
# Docs: https://render.com/docs/blueprint-spec
