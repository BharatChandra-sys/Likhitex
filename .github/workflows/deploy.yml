name: Deploy to Production

# Manual only. Render (autoDeploy) and Vercel (Git integration) already deploy
# on every push to main; running this on push too would deploy twice and fail
# whenever the VERCEL_* / RENDER_DEPLOY_HOOK_URL secrets are not configured.
on:
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Build and push compiler Docker image to GitHub Container Registry
  # ============================================================================
  build-compiler:
    name: Build Compiler Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/compiler
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push compiler image
        uses: docker/build-push-action@v5
        with:
          context: apps/compiler
          file: apps/compiler/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Deploy Frontend to Vercel
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install Vercel CLI
        run: npm install -g vercel
      
      - name: Pull Vercel environment
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Build project
        working-directory: ./frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Deploy to Vercel
        id: deploy
        working-directory: ./frontend
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Comment deployment URL
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Frontend deployed to: ${{ steps.deploy.outputs.url }}`
            })

  # ============================================================================
  # Deploy Backend to Render
  # ============================================================================
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: build-compiler
    environment:
      name: production
      url: https://likhitex-api.onrender.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}'
      
      - name: Wait for deployment
        run: |
          echo "Waiting 60s for Render to start deployment..."
          sleep 60
      
      - name: Check API health
        run: |
          for i in {1..10}; do
            if curl -f -s https://likhitex-api.onrender.com/health; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "⏳ Attempt $i/10 failed, waiting 30s..."
            sleep 30
          done
          echo "❌ API health check failed after 10 attempts"
          exit 1

  # ============================================================================
  # Post-Deployment Verification
  # ============================================================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test API endpoints
        run: |
          echo "Testing API health endpoint..."
          curl -f https://likhitex-api.onrender.com/health
          
          echo "Testing frontend..."
          curl -f https://likhitex.vercel.app/ > /dev/null
          
          echo "✅ All endpoints responding"
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
          echo "✅ Smoke tests passed"
      
      - name: Notify success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Frontend: https://likhitex.vercel.app"
          echo "Backend: https://likhitex-api.onrender.com"

# ============================================================================
# Required GitHub Secrets
# ============================================================================
# Set these in: GitHub repo > Settings > Secrets and variables > Actions
#
# VERCEL_TOKEN - Vercel personal access token (vercel.com/account/tokens)
# VERCEL_ORG_ID - From .vercel/project.json after running 'vercel link'
# VERCEL_PROJECT_ID - From .vercel/project.json after running 'vercel link'
# RENDER_DEPLOY_HOOK_URL - From Render Dashboard > Service > Settings > Deploy Hook
#
# Optional (for notifications):
# SLACK_WEBHOOK_URL - Slack incoming webhook URL
# DISCORD_WEBHOOK_URL - Discord webhook URL
