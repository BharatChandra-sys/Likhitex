name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend tests
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        working-directory: ./apps/api
        run: ruff check .
      
      - name: Type check with mypy
        working-directory: ./apps/api
        run: mypy app/
      
      - name: Run tests
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          CLERK_SECRET_KEY: test_secret
          SECRET_KEY: test_secret_key_minimum_32_chars_long
        run: pytest -v --cov=app --cov-report=xml
      
      - name: Security audit
        working-directory: ./apps/api
        run: pip-audit

  # Frontend tests
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/web/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci
      
      - name: Lint
        working-directory: ./apps/web
        run: npm run lint
      
      - name: Type check
        working-directory: ./apps/web
        run: npm run type-check
      
      - name: Build
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
        run: npm run build
      
      - name: Security audit
        working-directory: ./apps/web
        run: npm audit --audit-level=high

  # Secret scanning
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security tests (Phase 1+)
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run security test suite
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: test_secret_key_minimum_32_chars_long
        run: pytest tests/security/ -v --tb=short
