    <line x1="36" y1="26" x2="46" y2="26" stroke="white" stroke-width="2"/>
    <line x1="36" y1="32" x2="50" y2="32" stroke="white" stroke-width="2"/>
    <line x1="36" y1="38" x2="44" y2="38" stroke="white" stroke-width="2"/>
    
